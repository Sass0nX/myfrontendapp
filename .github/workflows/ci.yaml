name: Frontend CI

on:
  push:
    branches:
      - main

jobs:

  lint:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: frontend-app
        run: npm ci

      - name: Run lint
        working-directory: frontend-app
        run: npm run lint


  security:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        working-directory: frontend-app
        run: npm ci

      - name: Dependency security scan
        working-directory: frontend-app
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org/

      - name: Secret scan
        run: gitleaks git . --redact


  build:
    needs:
      - lint
      - security

    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: frontend-app
        run: npm ci

      - name: Run build
        working-directory: frontend-app
        run: npm run build

  docker:
    needs:
      - lint
      - security
      - build

    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: frontend-app
        run: npm ci

      - name: Run build
        working-directory: frontend-app
        run: npm run build

      - name: Build Docker image
        working-directory: frontend-app
        run: docker build -t frontend-app:${{ github.sha }} .

      - name: Login to Nexus Docker Registry
        shell: powershell
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          "Q1w2e3r4" | docker login 10.100.102.25:8081 `
            --username github-actions `
            --password-stdin

      - name: Push Docker image
        run: docker push 10.100.102.25:8081/docker-hosted/frontend-app:${{ github.sha }}