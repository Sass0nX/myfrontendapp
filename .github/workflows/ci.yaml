name: Frontend CI

on:
  push:
    branches:
      - main

jobs:

  lint:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: frontend-app
        run: npm ci

      - name: Run lint
        working-directory: frontend-app
        run: npm run lint


  security:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        working-directory: frontend-app
        run: npm ci

      - name: Dependency security scan
        working-directory: frontend-app
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org/

      - name: Secret scan
        run: gitleaks git . --redact


  build:
    needs:
      - lint
      - security

    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: frontend-app
        run: npm ci

      - name: Run build
        working-directory: frontend-app
        run: npm run build

  docker:
  needs:
    - lint
    - security
    - build

  runs-on: self-hosted

  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Docker image
      working-directory: frontend-app
      run: docker build -t frontend-app:${{ github.sha }} .

    - name: Login to Nexus Docker Registry
      shell: powershell
      env:
        NEXUS_USERNAME: ${{ secrets.NEXUS_DOCKER_USERNAME }}
        NEXUS_PASSWORD: ${{ secrets.NEXUS_DOCKER_PASSWORD }}
      run: |
        $env:NEXUS_PASSWORD | docker login http://10.100.102.25:8081/repository/docker-hosted/ `
          --username $env:NEXUS_USERNAME `
          --password-stdin

    - name: Push Docker image
      run: docker push frontend-app:${{ github.sha }}